<!doctype html>
<meta charset="utf-8">
<title>Icon generator</title>
<body style="background:#eee;font-family:sans-serif">
<p>Renders the app icons with the real cat renderer and saves them via tools/server.js.</p>
<div id="out"></div>
<script src="../js/util.js"></script>
<script src="../js/cat.js"></script>
<script>
  const look = { fur: 'mike', eye: 'amber', acc: { neck: 'suzu' } };
  const jobs = [['icon-192.png', 192, 0.18], ['icon-512.png', 512, 0.18], ['icon-maskable-512.png', 512, 0], ['apple-touch-icon.png', 180, 0], ['icon-1024.png', 1024, 0], ['logo-1024.png', 1024, 0.18]];
  (async () => {
    for (const [name, size, radius] of jobs) {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const x = c.getContext('2d');
      x.save();
      if (radius) { NB.U.rr(x, 0, 0, size, size, size * radius); x.clip(); }
      const g = x.createLinearGradient(0, 0, 0, size); g.addColorStop(0, '#ffe8f0'); g.addColorStop(1, '#ffb3cb');
      x.fillStyle = g; x.fillRect(0, 0, size, size);
      x.fillStyle = 'rgba(255,255,255,0.5)';
      for (let i = 0; i < 6; i++) NB.U.flower(x, size * [0.12, 0.88, 0.85, 0.1, 0.5, 0.92][i], size * [0.15, 0.12, 0.85, 0.82, 0.08, 0.5][i], size * 0.05, 'rgba(255,255,255,0.6)', 'rgba(255,200,220,0.8)', i);
      const tmp = document.createElement('canvas'); tmp.width = tmp.height = size;
      NB.Cat.portrait(tmp, look, { zoom: name.includes('maskable') ? 1.05 : 1.3, pose: { eyes: 'sparkle', blush: 0.8, mouth: 'w', mouthOpen: 0, lookY: 0.1 } });
      x.drawImage(tmp, 0, size * 0.04);
      x.restore();
      document.getElementById('out').appendChild(c);
      await fetch('/__icon?name=' + name, { method: 'POST', body: c.toDataURL('image/png') });
    }
    document.title = 'done';
  })();
</script>
</body>
